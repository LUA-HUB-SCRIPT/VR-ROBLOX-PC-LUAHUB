
name: Build LUAHUB Virtual VR EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build Windows EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name LUAHUB-Virtual-VR `
            --add-data "index.html;." `
            main.py

      - name: Package EXE
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist\source | Out-Null
          Copy-Item index.html dist\source\index.html
          Copy-Item main.py dist\source\main.py
          Copy-Item requirements.txt dist\source\requirements.txt
          Compress-Archive -Path dist\source\* `
            -DestinationPath dist\LUAHUB-Virtual-VR-Source.zip -Force

      - name: Upload EXE and source
        uses: actions/upload-artifact@v4
        with:
          name: LUAHUB-Virtual-VR-Windows
          path: |
            dist/LUAHUB-Virtual-VR.exe
            dist/LUAHUB-Virtual-VR-Source.zip
          if-no-files-found: error
          retention-days: 14
