
name: Build LUAHUB Virtual VR EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if (Test-Path requirements.txt) {
            python -m pip install -r requirements.txt
          } else {
            python -m pip install Flask flask-sock simple-websocket pyautogui
          }
          python -m pip install pyinstaller

      - name: Check Python
        run: python -m py_compile main.py

      - name: Build Windows EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name LUAHUB-Virtual-VR `
            --add-data "website;website" `
            main.py

      - name: Upload EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LUAHUB-Virtual-VR-Windows
          path: dist/LUAHUB-Virtual-VR.exe
          if-no-files-found: error
          retention-days: 14

      - name: Publish EXE to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: LUAHUB Virtual VR ${{ github.ref_name }}
          files: dist/LUAHUB-Virtual-VR.exe
          generate_release_notes: true
