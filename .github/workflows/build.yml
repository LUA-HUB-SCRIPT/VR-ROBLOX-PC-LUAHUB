
name: Build LUAHUB Virtual VR EXE

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - master
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      # 1. Ambil source code repository
      - name: Checkout source
        uses: actions/checkout@v5

      # 2. Setup Python
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # 3. Install dependencies
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip

          if (Test-Path requirements.txt) {
            python -m pip install -r requirements.txt
          } else {
            python -m pip install Flask flask-sock simple-websocket pyautogui
          }

          python -m pip install pyinstaller

      # 4. Periksa file utama
      - name: Check project files
        shell: pwsh
        run: |
          if (!(Test-Path main.py)) {
            throw "main.py tidak ditemukan!"
          }

          if (!(Test-Path index.html)) {
            throw "index.html tidak ditemukan!"
          }

          python -m py_compile main.py

      # 5. Build EXE
      - name: Build Windows EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name LUAHUB-Virtual-VR `
            --add-data "index.html;." `
            main.py

      # 6. Pastikan EXE berhasil dibuat
      - name: Verify EXE
        shell: pwsh
        run: |
          if (!(Test-Path "dist/LUAHUB-Virtual-VR.exe")) {
            throw "EXE gagal dibuat!"
          }

          Get-Item "dist/LUAHUB-Virtual-VR.exe"

      # 7. Upload EXE sebagai artifact
      - name: Upload EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LUAHUB-Virtual-VR-Windows
          path: dist/LUAHUB-Virtual-VR.exe
          if-no-files-found: error
          retention-days: 14

      # 8. Upload EXE ke GitHub Release
      - name: Publish EXE to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: LUAHUB Virtual VR ${{ github.ref_name }}
          files: dist/LUAHUB-Virtual-VR.exe
          generate_release_notes: true
