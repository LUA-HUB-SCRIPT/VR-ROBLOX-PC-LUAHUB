name: Build LUAHUB Virtual VR EXE

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Windows EXE
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name LUAHUB-Virtual-VR main.py

      - name: Bundle website and ADB setup notes
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist\website | Out-Null
          Copy-Item website\index.html dist\website\index.html
          Copy-Item README.md dist\README.txt
          Compress-Archive -Path dist\LUAHUB-Virtual-VR.exe,dist\website,dist\README.txt -DestinationPath dist\LUAHUB-Virtual-VR-Windows.zip -Force

      - name: Upload EXE and website bundle
        uses: actions/upload-artifact@v4
        with:
          name: LUAHUB-Virtual-VR-Windows
          path: |
            dist/LUAHUB-Virtual-VR.exe
            dist/LUAHUB-Virtual-VR-Windows.zip
          if-no-files-found: error
          retention-days: 14
